<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Etiquetas</title>
    <link rel="stylesheet" href="/css/styles2.css">
    <style type="text/css" media="print">
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .etiqueta {
            width: 160mm; /* Ancho de la etiqueta - Ajusta según necesidad */
            height: 100mm; /* Alto de la etiqueta - Ajusta según necesidad */
            padding: 10mm;
            margin: 5mm;
            box-sizing: border-box;
            border: 1px solid #ccc;
            page-break-inside: avoid; /* Evita cortes de página dentro de la etiqueta */
            display: inline-block;
            vertical-align: top; /* Alinea las etiquetas verticalmente */
        }
    </style>
</head>

<body>
    <h1>Generador de Etiquetas</h1>
    <button class="open-modal-button" id="openModal">Ingresar Datos</button>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ingrese Datos</h2>
            <form id="formulario">
                <label for="numeroRemito">Número de Remito:</label>
                <input type="text" id="numeroRemito" name="numeroRemito" required>

                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>

                <label for="cantidadBultos">Cantidad de Bultos:</label>
                <input type="number" id="cantidadBultos" name="cantidadBultos" min="1" required>

                <label for="observaciones">Observaciones:</label>
                <textarea id="observaciones" name="observaciones" rows="4"></textarea>

                <button type="submit">Generar Etiquetas</button>
            </form>
        </div>
    </div>

    <div id="etiquetas" class="etiquetas-container"></div>
    <script>
        // ... (código modal sin cambios)

        // Manejar el envío del formulario
        form.onsubmit = function (event) {
            event.preventDefault();

            // ... (obtener datos del formulario sin cambios)

            // Limpiar etiquetas anteriores
            const etiquetasDiv = document.getElementById('etiquetas');
            etiquetasDiv.innerHTML = '';

            // Generar etiquetas
            for (let i = 1; i <= cantidadBultos; i++) {
                const etiqueta = document.createElement('div');
                etiqueta.className = 'etiqueta';
                etiqueta.style.backgroundColor = '#e0f2f7'; // Color de fondo azul claro
                etiqueta.style.borderColor = '#4fc3f7';   // Borde azul más oscuro

                // Diseño de la etiqueta (con estilos)
                etiqueta.innerHTML = `
                    <div style="color: #1a237e; font-weight: bold; text-align: center; margin-bottom: 5px;">
                        Número de Remito: ${numeroRemito}
                    </div>
                    <div style="color: #0d47a1; margin-bottom: 5px;">
                        Fecha: ${fecha}
                    </div>
                    <div style="color: #0d47a1; margin-bottom: 5px;">
                        Bulto ${i} de ${cantidadBultos}
                    </div>
                    <div style="color: #1976d2;">
                        Observaciones: ${observaciones}
                    </div>
                `;

                etiquetasDiv.appendChild(etiqueta);
            }
            modal.style.display = "none";

            // Imprimir automáticamente
            window.print();
        }
    </script>
    <script src="/javascript/script.js"></script>
</body>

</html>
